name: Keep Render App Alive

on:
  schedule:
        - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping health endpoint
        run: |
          echo "Pinging https://orca-retail.onrender.com/health ..."
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
            --max-time 30 \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            -L \
            https://orca-retail.onrender.com/health)
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "App is alive!"
          else
            echo "Warning: Received status $STATUS - app may be starting up (cold start on Render free tier)"
          fi
